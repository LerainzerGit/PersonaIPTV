name: Build and deploy (debugging)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: personaiptv-build
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug - show workspace
        run: |
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          echo "PWD: $(pwd)"
          echo "Listing root:"
          ls -la
          echo "Listing scripts folder (if present):"
          ls -la scripts || true
          echo "Listing data folder (if present):"
          ls -la data || true
          echo "Show package.json (if present):"
          if [ -f package.json ]; then
            cat package.json
          else
            echo "package.json missing"
          fi

      - name: Check for build script and data file
        id: check
        run: |
          if [ -f scripts/build-playlists.js ]; then
            echo "build_script=true" >> $GITHUB_OUTPUT
          else
            echo "build_script=false" >> $GITHUB_OUTPUT
          fi

          if [ -f data/seed-channels.json ]; then
            echo "data_file=true" >> $GITHUB_OUTPUT
          else
            echo "data_file=false" >> $GITHUB_OUTPUT
          fi

      - name: Build site (only if build script exists)
        if: steps.check.outputs.build_script == 'true'
        run: |
          echo "Found build script — running npm install & build"
          # install only production dependencies (no package-lock assume small)
          npm install --silent
          npm run build

      - name: Skip build note (when no script)
        if: steps.check.outputs.build_script == 'false'
        run: |
          echo "No build script present at scripts/build-playlists.js — skipping build step"
          echo "If you expect a build step, ensure scripts/build-playlists.js exists and is committed to main"

      - name: Ensure public folder exists
        run: |
          if [ -d public ]; then
            echo "public folder exists"
            ls -la public
          else
            echo "public folder does NOT exist. If you rely on build to produce it, ensure the build ran successfully."
            ls -la || true
          fi

      - name: Deploy to gh-pages (push public/)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
